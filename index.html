<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Calorie Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .calculator-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .height-inputs {
            display: flex;
            gap: 10px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #eef2f7;
            display: none;
        }
        .result-box {
            background-color: #e8f4fd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 10px;
        }
        .calories {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2980b9;
        }
        .warning {
            color: #e67e22;
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Calorie Calculator</h2>

    <!-- Unit System Toggle -->
    <div class="form-group">
        <label for="unitSystem">Unit System:</label>
        <select id="unitSystem" onchange="toggleUnitSystem()">
            <option value="imperial">Imperial (lbs, ft/in)</option>
            <option value="metric">Metric (kg, cm)</option>
        </select>
    </div>

    <!-- Biological Sex Selection -->
    <div class="form-group">
        <label for="sex">Biological Sex:</label>
        <select id="sex">
            <option value="female">Female</option>
            <option value="male">Male</option>
        </select>
    </div>

    <!-- Age Input -->
    <div class="form-group">
        <label for="age">Age (years):</label>
        <input type="number" id="age" placeholder="e.g., 38" min="1" max="120">
    </div>

    <!-- Dynamic Height Input Group -->
    <div class="form-group">
        <label id="heightLabel">Height:</label>
        <div id="imperialHeightInputs" class="height-inputs">
            <input type="number" id="heightFt" placeholder="Ft" min="1" max="8">
            <input type="number" id="heightIn" placeholder="In" min="0" max="11" value="0">
        </div>
        <div id="metricHeightInput" style="display: none;">
            <input type="number" id="heightCm" placeholder="Centimeters (cm)" min="30" max="250">
        </div>
    </div>

    <!-- Dynamic Weight Input Group -->
    <div class="form-group">
        <label id="weightLabel" for="weight">Current Weight (lbs):</label>
        <input type="number" id="weight" placeholder="e.g., 150" min="10">
    </div>

    <!-- Activity Level Selection -->
    <div class="form-group">
        <label for="activity">Daily Activity Level:</label>
        <select id="activity">
            <option value="1.2">Sedentary (Desk job, little exercise)</option>
            <option value="1.375">Lightly Active (Light exercise 1-3 days/wk)</option>
            <option value="1.55">Moderately Active (Moderate exercise 3-5 days/wk)</option>
            <option value="1.725">Very Active (Hard exercise 6-7 days/wk)</option>
        </select>
    </div>

    <button onclick="calculateCalories()">Calculate My Target</button>

    <div id="results" class="results">
        <strong>Your Weight Loss Target:</strong>
        <div class="result-box">
            <div id="calorieOutput" class="calories">0</div>
            <div>calories per day</div>
            <div id="safetyWarning" class="warning" style="display: none;">
                ⚠️ Target locked to health safety floor.
            </div>
        </div>
        <p style="font-size: 0.85rem; color: #7f8c8d; text-align: center; margin-top: 15px;">
            This target creates a 500-calorie deficit to lose 1 pound per week.
        </p>
    </div>
</div>

<script>
function toggleUnitSystem() {
    const system = document.getElementById('unitSystem').value;
    const impHeight = document.getElementById('imperialHeightInputs');
    const metHeight = document.getElementById('metricHeightInput');
    const weightLabel = document.getElementById('weightLabel');
    const weightInput = document.getElementById('weight');

    if (system === 'imperial') {
        impHeight.style.display = 'flex';
        metHeight.style.display = 'none';
        weightLabel.innerText = 'Current Weight (lbs):';
        weightInput.placeholder = 'e.g., 150';
    } else {
        impHeight.style.display = 'none';
        metHeight.style.display = 'block';
        weightLabel.innerText = 'Current Weight (kg):';
        weightInput.placeholder = 'e.g., 70';
    }
}

function calculateCalories() {
    const system = document.getElementById('unitSystem').value;
    const sex = document.getElementById('sex').value;
    const age = parseInt(document.getElementById('age').value);
    const weightInputVal = parseFloat(document.getElementById('weight').value);
    const activityFactor = parseFloat(document.getElementById('activity').value);
    
    // Quick validation basics
    if (!age || !weightInputVal || age <= 0 || weightInputVal <= 0) {
        alert("Please enter a valid age and weight.");
        return;
    }

    let weightKg = 0;
    let heightCm = 0;

    // 1. Process measurements based on selected unit system
    if (system === 'imperial') {
        const heightFt = parseFloat(document.getElementById('heightFt').value);
        const heightIn = parseFloat(document.getElementById('heightIn').value) || 0;
        
        if (!heightFt || heightFt <= 0) {
            alert("Please enter a valid height in feet.");
            return;
        }
        
        weightKg = weightInputVal * 0.45359237;
        const totalInches = (heightFt * 12) + heightIn;
        heightCm = totalInches * 2.54;
    } else {
        const metricCm = parseFloat(document.getElementById('heightCm').value);
        
        if (!metricCm || metricCm <= 0) {
            alert("Please enter a valid height in centimeters.");
            return;
        }
        
        weightKg = weightInputVal;
        heightCm = metricCm;
    }

    // 2. Mifflin-St Jeor Equation
    let bmr = 0;
    if (sex === 'male') {
        bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) + 5;
    } else {
        bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 161;
    }

    // 3. TDEE
    const tdee = bmr * activityFactor;

    // 4. Subtract deficit
    let targetCalories = Math.round(tdee - 500);

    // 5. Sex-Specific Safety Floor Rules
    let safeFloorApplied = false;
    const floorLimit = (sex === 'male') ? 1500 : 1200;

    if (targetCalories < floorLimit) {
        targetCalories = floorLimit;
        safeFloorApplied = true;
    }

    // 6. Display results
    document.getElementById('calorieOutput').innerText = targetCalories.toLocaleString();
    
    const warningEl = document.getElementById('safetyWarning');
    warningEl.innerText = `⚠️ Target locked to ${floorLimit.toLocaleString()} calorie safety floor.`;
    warningEl.style.display = safeFloorApplied ? 'block' : 'none';
    
    document.getElementById('results').style.display = 'block';
}
</script>

</body>
</html>
